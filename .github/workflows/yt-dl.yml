name: YouTube Downloader
run-name: "Batch Download → ${{ inputs.youtube_urls }}"
on:
  workflow_dispatch:
    inputs:
      youtube_urls:
        description: "YouTube URLs separated by comma (,)"
        required: true
        type: string
      quality:
        description: "Video quality (best, 1080, 720, 480, audio)"
        required: false
        default: "best"
        type: string
      playlist:
        description: "Download the whole playlist/channel when the URL points to one"
        required: false
        default: false
        type: boolean
      playlist_items:
        description: "Playlist range, e.g. 1-20 or 1,5,8 (blank = first 50)"
        required: false
        default: ""
        type: string

jobs:
  download-youtube:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 1

      - name: Configure Git
        run: |
          git config --global http.postBuffer 524288000
          git config --global http.maxRequestBuffer 100M
          git config --global core.compression 0
          git config --global pack.windowMemory 256m
          git config --global pack.packSizeLimit 100m
          git config --global pack.threads 1
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 300
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"

      - name: Start WARP Container
        run: |
          docker network create warp-net || true

          docker run -d \
            --name warp \
            --restart=always \
            --network warp-net \
            -p 1080:1080 \
            --cap-add NET_ADMIN \
            --sysctl net.ipv6.conf.all.disable_ipv6=0 \
            --sysctl net.ipv4.conf.all.src_valid_mark=1 \
            -v warp-data:/var/lib/cloudflare-warp \
            caomingjun/warp

          sleep 30

          for i in {1..10}; do
            RESULT=$(curl -s --max-time 10 --socks5-hostname 127.0.0.1:1080 https://cloudflare.com/cdn-cgi/trace 2>/dev/null || echo "failed")
            if echo "$RESULT" | grep -qE "warp=(on|plus)"; then
              echo "WARP is active!"
              break
            fi
            sleep 10
          done

      - name: Start PO Token Provider
        run: |
          # GVS Proof-of-Origin token provider. The Deno JS solver clears the
          # bot CHECK, but large/adaptive streams (e.g. 4K 401+251) also need a
          # GVS PO token or YouTube returns HTTP 403 mid-download. This sidecar
          # mints those tokens; the bgutil plugin (installed below) auto-discovers
          # it on port 4416.
          #
          # --network host is REQUIRED: to generate a token the provider must
          # reach WARP, which yt-dlp tells it to use at socks5://127.0.0.1:1080.
          # Without host networking, 127.0.0.1 inside the container is the
          # container itself (not the host's WARP port), so the token request
          # hangs forever ("Generating a gvs PO Token" loops). Host networking
          # makes 127.0.0.1:1080 resolve to the runner's WARP port, and the
          # provider's own HTTP server stays reachable on 4416.
          docker run -d \
            --name bgutil-provider \
            --init \
            --network host \
            brainicism/bgutil-ytdlp-pot-provider

          echo "Waiting for PO token provider to come up..."
          for i in {1..15}; do
            if curl -fsS --max-time 5 http://127.0.0.1:4416/ping >/dev/null 2>&1; then
              echo "PO token provider is up"
              break
            fi
            sleep 4
          done

      - name: Install Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq python3-pip ffmpeg zip curl bc unzip

          # Deno powers yt-dlp's built-in JS challenge solver
          # (--js-runtimes deno --remote-components ejs), which solves the n-sig /
          # bot-check challenge. It works alongside the bgutil GVS PO token
          # provider (started above): the solver clears the check, the PO token
          # authorizes large/adaptive stream downloads so they don't 403.
          curl -fsSL https://deno.land/install.sh | sh
          export DENO_INSTALL="$HOME/.deno"
          export PATH="$DENO_INSTALL/bin:$PATH"
          echo "$DENO_INSTALL/bin" >> "$GITHUB_PATH"
          deno --version

          pip3 install --upgrade --force-reinstall "yt-dlp @ https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.tar.gz"

          # PO token provider plugin — yt-dlp auto-discovers the sidecar container
          # on 127.0.0.1:4416 and fetches GVS PO tokens transparently.
          pip3 install -U bgutil-ytdlp-pot-provider

          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "yt-dlp version: $(yt-dlp --version)"

      - name: Download YouTube Video
        env:
          YOUTUBE_URLS: ${{ github.event.inputs.youtube_urls }}
          QUALITY: ${{ github.event.inputs.quality }}
          PLAYLIST: ${{ github.event.inputs.playlist }}
          PLAYLIST_ITEMS: ${{ github.event.inputs.playlist_items }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          chmod +x scripts/download.sh
          ./scripts/download.sh

      - name: Split Push
        run: |
          BRANCH="${GITHUB_REF_NAME}"

          BACKUP_DIR=$(cat /tmp/backup_dir_path.txt)
          DEST_FOLDER=$(cat /tmp/dest_folder.txt)

          FILE_COUNT=$(find "$BACKUP_DIR" -type f 2>/dev/null | wc -l)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "No files to push!"
            exit 1
          fi

          git pull --rebase origin "$BRANCH" || true

          mkdir -p "$DEST_FOLDER"
          cp -r "$BACKUP_DIR"/. "$DEST_FOLDER"/

          find "$DEST_FOLDER" -type f | split -l 5 - /tmp/git_batch_

          BATCH_TOTAL=$(ls /tmp/git_batch_* 2>/dev/null | wc -l)
          BATCH_NUM=0
          FAILED_BATCHES=0

          for batch in /tmp/git_batch_*; do
            BATCH_NUM=$((BATCH_NUM + 1))
            echo "Batch $BATCH_NUM/$BATCH_TOTAL"

            git reset

            while read -r FILE; do
              git add "$FILE"
            done < "$batch"

            if git diff --cached --quiet; then
              continue
            fi

            git commit -m "Batch $BATCH_NUM/$BATCH_TOTAL [skip ci]"

            PUSHED=false
            for i in 1 2 3 4 5; do
              if git push origin HEAD:"$BRANCH"; then
                PUSHED=true
                break
              fi
              git pull --rebase origin "$BRANCH" || true
              sleep $((i * 5))
            done

            if [ "$PUSHED" = false ]; then
              echo "Batch $BATCH_NUM failed"
              FAILED_BATCHES=$((FAILED_BATCHES + 1))
              git reset HEAD~1 --soft || true
            fi
          done

          if [ "$FAILED_BATCHES" -eq "$BATCH_TOTAL" ]; then
            echo "All batches failed!"
            exit 1
          fi

      - name: Stop WARP Container
        if: always()
        run: |
          docker stop warp || true
          docker rm warp || true
          docker stop bgutil-provider || true
          docker rm bgutil-provider || true
